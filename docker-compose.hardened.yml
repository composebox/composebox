services:
  composebox:
    image: ghcr.io/composebox/composebox:latest
    container_name: composebox
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /path/to/your/stacks:/stacks
    environment:
      - STACKS_DIR=/stacks
      - PORT=8080
      - DOCKER_HOST=tcp://socket-proxy:2375
    depends_on:
      - socket-proxy
    networks:
      - default
      - socket-net

  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: composebox-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # API permissions required for Docker Compose orchestration
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=1
      - INFO=1
      - VERSION=1
      - EVENTS=1
      # Explicitly block sensitive daemon subsystems
      - AUTH=0
      - SECRETS=0
      - SWARM=0
      - NODES=0
      - SERVICES=0
      - TASKS=0
      - PLUGINS=0
      - SYSTEM=0
    networks:
      - socket-net

networks:
  socket-net:
    internal: true
