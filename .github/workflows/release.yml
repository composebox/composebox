name: Release Binaries

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Build Embedded UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Cross-Compile Release Binaries
        run: |
          mkdir -p dist
          COMMIT="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.Version=${GITHUB_REF_NAME} -X main.GitCommit=${COMMIT} -X main.BuildDate=${DATE}"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/composebox-linux-amd64 ./cmd/composebox
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/composebox-linux-arm64 ./cmd/composebox

          cd dist
          sha256sum composebox-linux-amd64 composebox-linux-arm64 > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/composebox-linux-amd64 dist/composebox-linux-arm64 dist/checksums.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/composebox-linux-amd64 dist/composebox-linux-arm64 dist/checksums.txt \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
